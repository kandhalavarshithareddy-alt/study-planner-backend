spring.application.name=studyplanner
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studyplanner}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://kandhalavarshithareddy-alt.github.io}
